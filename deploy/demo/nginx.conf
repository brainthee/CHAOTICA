# TLS terminates at the upstream proxy (Nginx Proxy Manager); this listens on
# plain :80. Do NOT set X-Forwarded-Proto to $scheme here — $scheme is "http",
# which makes Django see the request as http and fail CSRF (403 on login). Let
# the upstream's X-Forwarded-Proto: https pass through untouched.

# Re-resolve `web` via Docker's embedded DNS instead of once at startup. A
# static `upstream` pins the container IP; when web was recreated (new image)
# it got a new IP, the DB took the old one, and nginx proxied to MariaDB → 502.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;

    set $chaotica http://web:8000;

    # Upload limit for evidence/report attachments.
    client_max_body_size 50m;

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /etc/nginx/maintenance;
        internal;
    }

    location / {
        # reset_demo.sh creates this flag while the database is rebuilt, so
        # nobody sees a half-seeded site (or the fresh-install setup wizard).
        if (-f /etc/nginx/maintenance/on) {
            return 503;
        }
        proxy_pass $chaotica;
        proxy_http_version 1.1;
        # Live scheduler WebSockets (/ws/) are served by the same ASGI process.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }
}
