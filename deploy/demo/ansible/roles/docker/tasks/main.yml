# Docker CE + compose plugin from Docker's official apt repo (Ubuntu's
# docker.io lags and ships no compose v2 plugin).
- name: Remove distro container packages that conflict with Docker CE
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
    state: absent

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure the Docker daemon (bounded container logs)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Enable Docker on boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Let the admin user run docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
