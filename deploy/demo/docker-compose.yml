# Public demo (demo.chaotica.app).
#
# Runs the published image exactly as production does — the image's own
# entrypoint + CMD (supervisord: gunicorn/uvicorn ASGI, redis, cron). The ONLY
# demo-specific bits are environment variables, all supplied via `.env`
# (rendered by Ansible from ansible/group_vars/all.yml; see .env.example).
#
# Data is disposable: reset_demo.sh tears the whole stack down *including
# volumes* every night and rebuilds it from scratch.
name: chaotica-demo

services:
  web:
    image: ${CHAOTICA_IMAGE:-brainthee/chaotica:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed by the topology of this compose file, not tunables.
      - SQL_ENGINE=django.db.backends.mysql
      - RDS_HOSTNAME=db
      - RDS_PORT=3306
      - RDS_DB_NAME=chaotica
      - RDS_USERNAME=chaotica
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    expose:
      - 8000
    healthcheck:
      # The entrypoint runs `migrate` before supervisord starts gunicorn, so on a
      # fresh database this only goes healthy once the schema is fully built.
      # Any HTTP response (incl. a redirect) means the app is serving.
      test: ["CMD", "curl", "-so", "/dev/null", "http://127.0.0.1:8000/auth/login/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30m
      start_interval: 10s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=chaotica
      - MARIADB_USER=chaotica
      - MARIADB_PASSWORD=${RDS_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # reset_demo.sh drops a flag file here to serve the maintenance page
      # while the database is being rebuilt.
      - ./maintenance:/etc/nginx/maintenance:ro
    ports:
      - 80:80

volumes:
  mariadb_data:
  static_volume:
  media_volume:
