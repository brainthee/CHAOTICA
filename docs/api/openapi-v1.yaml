openapi: 3.0.3
info:
  title: CHAOTICA API
  version: 1.0.0
  description: Read-only REST API for CHAOTICA engagement lifecycle data.
paths:
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        POST username/password -> DRF token.

        It is a password login, so it obeys the same switch as the login page
        (``LOCAL_LOGIN_ENABLED``) and is rate limited per client IP.
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/v1/clients/:
    get:
      operationId: clients_list
      description: |-
        Shared base for every ``/api/v1/`` model endpoint.

        Read-only *today* — ``http_method_names`` is restricted to safe verbs — but it
        subclasses ``ModelViewSet`` (not ``ReadOnlyModelViewSet``) on purpose: enabling
        writes later is a localised change (widen ``http_method_names``, point at a
        write-capable serializer, add an object-level permission class) rather than a
        rewrite.

        It also *locally* overrides the global datatables renderer / pagination / filter
        defaults (see ``settings.REST_FRAMEWORK``) so v1 emits clean paginated JSON
        without affecting the legacy ``/api/`` DataTables UI endpoints.

        Access scoping: set ``policy_scope`` to a :mod:`jobtracker.policy` scope
        action (e.g. ``"job.view"``); ``None`` means reference data visible to every
        authenticated user, and must be a deliberate choice. Override
        :meth:`get_base_queryset` for select/prefetch.

        Filtering: declare ``filterset_class`` / ``ordering_fields`` /
        ``search_fields`` per view. Ordering is an allowlist — nothing is orderable
        unless listed.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - clients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientList'
          description: ''
