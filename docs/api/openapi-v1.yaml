  /api/v1/schedule/:
    get:
      operationId: schedule_retrieve
      description: Composite schedule (timeslots, leave, holidays, per-user availability)
        for the caller's visible users over a date window. Not paginated — bound the
        result with ``start``/``end`` (default today → +28 days, max 366-day span).
        Optionally narrow with ``unit`` and ``user``.
      summary: Global schedule window
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: Window end (ISO date). Defaults to start + 28 days. Span must
          be 366 days or fewer.
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Window start (ISO date, YYYY-MM-DD). Defaults to today.
      - in: query
        name: unit
        schema:
          type: integer
        description: Restrict to members of this org unit (within scope).
      - in: query
        name: user
        schema:
          type: integer
        description: Restrict to a single user id (within scope).
      tags:
      - schedule
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: ''
