    Holiday:
      type: object
      description: |-
        Public/non-working day. Applies to a country; a consumer matches it to a
        user via the user's country.
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        reason:
          type: string
          maxLength: 255
      required:
      - date
      - id
      - reason
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job_id:
          type: integer
          readOnly: true
        slug:
          type: string
          format: uuid
          readOnly: true
        external_id:
          type: string
          nullable: true
          description: 'Optional: External reference ID'
          maxLength: 255
        title:
          type: string
          title: Job Title
          maxLength: 250
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatusEnum'
          title: Job Status
          description: |-
            Current state of the job

            * `0` - Draft
            * `1` - Pending Scoping
            * `2` - Scoping
            * `3` - Additional Scoping Required
            * `4` - Pending Scope Signoff
            * `5` - Scoping Complete
            * `6` - Pending Start
            * `7` - In Progress
            * `8` - Completed
            * `9` - Lost
            * `10` - Deleted
            * `11` - Archived
          minimum: -2147483648
          maximum: 2147483647
        status_display:
          type: string
          readOnly: true
        unit:
          allOf:
          - $ref: '#/components/schemas/Ref'
          nullable: true
          readOnly: true
        client:
          allOf:
          - $ref: '#/components/schemas/Ref'
          nullable: true
          readOnly: true
        account_manager:
          allOf:
          - $ref: '#/components/schemas/Ref'
          nullable: true
          readOnly: true
        desired_start_date:
          type: string
          format: date
          nullable: true
          title: Start Date
          description: If set, will override scheduled dates
        desired_delivery_date:
          type: string
          format: date
          nullable: true
          title: Delivery date
          description: If set, will override scheduled dates
        is_restricted:
          type: boolean
          nullable: true
          title: Is the engagement Protectively Marked
        restricted_detail:
          nullable: true
          title: GSC level
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/RestrictedDetailEnum'
          - $ref: '#/components/schemas/NullEnum'
        restricted_detail_display:
          type: string
          readOnly: true
        phase_count:
          type: integer
          readOnly: true
        web_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - account_manager
      - client
      - id
      - job_id
      - phase_count
      - restricted_detail_display
      - slug
      - status_display
      - title
      - unit
      - web_url
