    WorkflowStep:
      type: object
      properties:
        status:
          type: integer
        label:
          type: string
        state:
          $ref: '#/components/schemas/StateEnum'
      required:
      - label
      - state
      - status
    WorkflowTransition:
      type: object
      properties:
        name:
          type: string
        target:
          type: integer
        label:
          type: string
        style:
          type: string
        icon:
          type: string
        menu:
          type: boolean
        needs_reason:
          type: boolean
        ready:
          type: boolean
        allowed:
          type: boolean
      required:
      - allowed
      - icon
      - label
      - menu
      - name
      - needs_reason
      - ready
      - style
      - target
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          refreshUrl: /o/token/
          scopes:
            read: Read your CHAOTICA data
            write: Make changes for you
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
servers:
- url: /api/v1
