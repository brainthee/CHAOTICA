  /api/v1/jobs/:
    get:
      operationId: jobs_list
      description: |-
        Shared base for every ``/api/v1/`` model endpoint.

        Read-only *today* — ``http_method_names`` is restricted to safe verbs — but it
        subclasses ``ModelViewSet`` (not ``ReadOnlyModelViewSet``) on purpose: enabling
        writes later is a localised change (widen ``http_method_names``, point at a
        write-capable serializer, add an object-level permission class) rather than a
        rewrite.

        It also *locally* overrides the global datatables renderer / pagination / filter
        defaults (see ``settings.REST_FRAMEWORK``) so v1 emits clean paginated JSON
        without affecting the legacy ``/api/`` DataTables UI endpoints.

        Access scoping: set ``policy_scope`` to a :mod:`jobtracker.policy` scope
        action (e.g. ``"job.view"``); ``None`` means reference data visible to every
        authenticated user, and must be a deliberate choice. Override
        :meth:`get_base_queryset` for select/prefetch.

        Filtering: declare ``filterset_class`` / ``ordering_fields`` /
        ``search_fields`` per view. Ordering is an allowlist — nothing is orderable
        unless listed.
      parameters:
      - in: query
        name: account_manager
        schema:
          type: string
      - in: query
        name: client
        schema:
          type: number
      - in: query
        name: desired_start_after
        schema:
          type: string
          format: date
      - in: query
        name: desired_start_before
        schema:
          type: string
          format: date
      - in: query
        name: involving
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: integer
          title: Job Status
          enum:
          - 0
          - 1
          - 10
          - 11
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          - 9
        description: |-
          Current state of the job

          * `0` - Draft
          * `1` - Pending Scoping
          * `2` - Scoping
          * `3` - Additional Scoping Required
          * `4` - Pending Scope Signoff
          * `5` - Scoping Complete
          * `6` - Pending Start
          * `7` - In Progress
          * `8` - Completed
          * `9` - Lost
          * `10` - Deleted
          * `11` - Archived
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: unit
        schema:
          type: number
      tags:
      - jobs
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
          description: ''
