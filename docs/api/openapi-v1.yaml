  /api/v1/users/{id}/schedule/:
    get:
      operationId: users_schedule_retrieve
      description: Composite schedule (timeslots, leave, holidays, availability) for
        one user over a date window. Authorised by schedule visibility (``view_users_schedule``
        on a shared org unit, or the user themselves) — not the ``view_user`` list
        scope — mirroring the scheduler feeds. See ``/schedule/`` for all visible
        users.
      summary: A single user's schedule window
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: Window end (ISO date). Defaults to start + 28 days. Span must
          be 366 days or fewer.
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Window start (ISO date, YYYY-MM-DD). Defaults to today.
