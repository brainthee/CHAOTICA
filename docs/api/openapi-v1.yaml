  /api/v1/users/{id}/schedule/:
    get:
      operationId: users_schedule_retrieve
      description: Composite schedule (timeslots, leave, holidays, availability) for
        one user over a date window. Authorised by schedule visibility (``view_users_schedule``
        on a shared org unit, or the user themselves) — not the ``view_user`` list
        scope — mirroring the scheduler feeds. See ``/schedule/`` for all visible
        users.
      summary: A single user's schedule window
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: Window end (ISO date). Defaults to start + 28 days. Span must
          be 366 days or fewer.
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Window start (ISO date, YYYY-MM-DD). Defaults to today.
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: ''
  /api/v1/users/{id}/set-cost/:
    post:
      operationId: users_set_cost_create
      description: 'Set a user''s date-effective loaded cost rate (LCR). Effective-dated
        and idempotent: if the rate in force on ``effective_from`` (default today)
        already equals the posted value, nothing is written (``changed=false``); otherwise
        a new row is added at that date and the previous rate is superseded from then
        on. So a weekly import only ever adds a row when the number actually moves.
        Gated on the ``jobtracker.can_view_loaded_costs`` finance permission — held
        globally, or on every org-unit the target belongs to.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCostUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCostUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCostUpdate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/users/{id}/set-job-level/:
    post:
      operationId: users_set_job_level_create
      description: 'Set or clear a user''s current career level (by short label, e.g.
        ``JL5``). Effective-dated and idempotent: a new assignment is only created
        when the level actually changes, dated ``effective_from`` (default today),
        and the prior assignment is closed off (is_current=False) — so re-running
        an unchanged import is a no-op. Reproduces the UI''s job-level gate: the caller
        must be the user''s (acting) manager, a superuser/staff, or the user themselves
        when they have no manager.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserJobLevelUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserJobLevelUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserJobLevelUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{id}/set-status/:
    post:
      operationId: users_set_status_create
      description: Activate or deactivate a user account. Requires the ``chaotica_utils.manage_user``
        permission. Deactivation also closes the user's open team and org-unit memberships.
        Idempotent.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - users
      requestBody:
        content:
