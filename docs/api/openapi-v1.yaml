          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
