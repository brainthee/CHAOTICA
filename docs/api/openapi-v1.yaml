components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          allOf:
          - $ref: '#/components/schemas/Ref'
          nullable: true
          readOnly: true
        verb:
          type: string
        category:
          type: string
        message:
          type: string
      required:
      - actor
      - at
      - category
      - id
      - message
      - verb
    AlarmGroup:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlarmItem'
      required:
      - items
      - key
      - label
      - severity
    AlarmItem:
      type: object
      properties:
        ref:
          allOf:
          - $ref: '#/components/schemas/Ref'
          nullable: true
          readOnly: true
        date:
          type: string
          format: date
          nullable: true
        people:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        message:
          type: string
      required:
      - date
      - message
      - people
      - ref
    Alarms:
      type: object
      properties:
        overdue:
          type: array
          items:
            $ref: '#/components/schemas/AlarmGroup'
        stale:
          type: array
          items:
            $ref: '#/components/schemas/AlarmGroup'
        counts:
          type: object
          additionalProperties:
            type: integer
      required:
      - counts
      - overdue
      - stale
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    AvailabilityEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `0` - Unavailable
        * `1` - Available
        * `2` - Busy - Internal
        * `3` - Busy - Delivery
    AvailabilityRun:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
      required:
      - end
      - start
    AwardingBody:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          default: ''
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        url:
          type: string
          format: uri
          nullable: true
          title: Website URL
          maxLength: 2000
      required:
      - id
      - name
    BillingBadge:
      type: object
      description: 'A billing code as a badge: code and name only, never money.'
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
    Choice:
      type: object
      properties:
        value:
          type: integer
        label:
          type: string
      required:
      - label
      - value
    Client:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Legal name of the client
          maxLength: 255
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        is_ready:
          type: boolean
          readOnly: true
        account_managers:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          readOnly: true
        tech_account_managers:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          readOnly: true
        jobs_count:
          type: integer
          readOnly: true
        projects_count:
          type: integer
          readOnly: true
        web_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - account_managers
      - id
      - is_ready
      - jobs_count
      - name
      - projects_count
      - tech_account_managers
      - web_url
    ClientDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Legal name of the client
          maxLength: 255
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        is_ready:
          type: boolean
          readOnly: true
        account_managers:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          readOnly: true
        tech_account_managers:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          readOnly: true
        jobs_count:
          type: integer
          readOnly: true
        projects_count:
          type: integer
          readOnly: true
        web_url:
          type: string
          nullable: true
          readOnly: true
        short_name:
          type: string
          description: To be used when referring to this client in documents such
            as proposals.
          maxLength: 100
        external_id:
          type: string
          maxLength: 255
        hours_in_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          description: The number of billable hours in a day
        specific_requirements:
          type: string
          nullable: true
          description: Any special notes, e.g. certain individuals, onboarding required
            etc
        specific_reporting_requirements:
          type: string
          nullable: true
          description: Any special reporting requirements
        onboarding_required:
          type: boolean
          description: Only onboarded users can be scheduled on jobs for this client.
        onboarding_requirements:
          type: string
          nullable: true
          title: Reoccurring Requirements
          description: What requirements are there every renewal.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          readOnly: true
        frameworks:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          readOnly: true
      required:
      - account_managers
      - contacts
      - frameworks
      - id
      - is_ready
      - jobs_count
      - name
      - projects_count
      - tech_account_managers
      - web_url
    ConsultantStats:
      type: object
      properties:
        jobs_participated:
          type: integer
        jobs_led:
          type: integer
        reports_authored:
          type: integer
        scoped:
          type: integer
        qaed:
          type: integer
      required:
