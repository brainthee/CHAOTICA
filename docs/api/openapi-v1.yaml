        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/users/{id}/update-profile/:
    post:
      operationId: users_update_profile_create
      description: 'Partially update a user''s org-chart profile (first/last name,
        job title, city, country). Reproduces the gate on the ``update_profile`` UI
        view: the caller must be the user themselves, their (acting) manager, or hold
        ``chaotica_utils.manage_user``. Does not touch account status, cost rates
        or job level (those have their own actions).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
