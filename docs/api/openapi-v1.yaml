openapi: 3.0.3
info:
  title: CHAOTICA API
  version: 1.0.0
  description: Read-only REST API for CHAOTICA engagement lifecycle data.
paths:
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        POST username/password -> DRF token.

        It is a password login, so it obeys the same switch as the login page
        (``LOCAL_LOGIN_ENABLED``) and is rate limited per client IP.
      tags:
      - auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
