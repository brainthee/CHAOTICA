    UserSkill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/Ref'
          nullable: true
          readOnly: true
        skill:
          allOf:
          - $ref: '#/components/schemas/Ref'
          nullable: true
          readOnly: true
        rating:
          allOf:
          - $ref: '#/components/schemas/RatingEnum'
          minimum: -2147483648
          maximum: 2147483647
        rating_display:
          type: string
          readOnly: true
        interested_in_improving_skill:
          type: boolean
        last_updated_on:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - last_updated_on
      - rating_display
      - skill
      - user
    UserStatusUpdate:
      type: object
      description: |-
        Write body for the ``users/{id}/set-status/`` action.

        Deliberately tiny: a single boolean so the endpoint can never be repurposed
        to edit arbitrary user fields.
      properties:
        is_active:
          type: boolean
      required:
      - is_active
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
servers:
- url: /api/v1
