  /api/v1/jobs/:
    get:
      operationId: jobs_list
      description: |-
        ``/{id}/notes/`` and ``/{id}/activity/``, visible to whoever can see
        the object (the object's own scope applies via ``get_object``).
      parameters:
      - in: query
        name: account_manager
        schema:
          type: string
      - in: query
        name: client
        schema:
          type: number
      - in: query
        name: desired_start_after
        schema:
          type: string
          format: date
      - in: query
        name: desired_start_before
        schema:
          type: string
          format: date
      - in: query
        name: exclude_status
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: involving
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: queue
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: integer
          title: Job Status
          enum:
          - 0
          - 1
          - 10
          - 11
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          - 9
        description: |-
          Current state of the job

          * `0` - Draft
          * `1` - Pending Scoping
          * `2` - Scoping
          * `3` - Additional Scoping Required
          * `4` - Pending Scope Signoff
          * `5` - Scoping Complete
          * `6` - Pending Start
          * `7` - In Progress
          * `8` - Completed
          * `9` - Lost
          * `10` - Deleted
          * `11` - Archived
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: unit
        schema:
          type: number
      tags:
      - jobs
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
          description: ''
