<table class="table align-items-center mb-0">
    <caption>Contact List</caption>
    <thead>
        <tr>
            <th class="px-3 text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Name</th>
            <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Phone</th>
            <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Email</th>
            {% if perms.jobtracker.delete_contact %}
            <th class="text-end text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 pe-3"></th>
            {% endif %}
        </tr>
    </thead>
    <tbody>
        {% for contact in contacts %}
    <tr>
        <td class="px-3">
            <div class="d-flex px-2 py-1">
                <div class="d-flex flex-column justify-content-center">
                    <h6 class="mb-0 text-xs">{{ contact }}</h6>
                    <p class="text-xs text-secondary mb-0">{{ contact.jobtitle }}</p>
                </div>
            </div>
        </td>
        <td>
            <p class="text-xs text-secondary mb-0">{{ contact.phone }}</p>
        </td>
        <td class="align-middle text-center text-sm">
            <p class="text-xs text-secondary mb-0">{{ contact.email }}</p>
        </td>
        {% if perms.jobtracker.delete_contact %}
        <td class="align-middle text-end pe-3">
            <a href="{% url 'client_contact_delete' contact.company.slug contact.pk %}" class="btn btn-sm btn-link text-danger p-0" title="Delete contact"><span class="fa-solid fa-trash"></span></a>
        </td>
        {% endif %}
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">
            <p class="px-3 text-xs text-secondary mb-0">No contacts found</p>  
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
