<ul class="dropdown-menu dropdown-menu-end p-0" style="z-index: 9999;">
  <li>
    <a href="{% url 'job_edit' job.slug %}" class="dropdown-item">Edit Job</a>
  </li>
  <li>
    <button data-url="{% url 'job_clone' job.slug %}" class="dropdown-item js-load-modal-form">Clone Job</button>
  </li>
  <li>
    <button type="button" class="dropdown-item text-primary" id="follow-button" data-bs-toggle="modal" data-bs-target="#followEntityModal"><i class="fas fa-bell"></i> <span id="follow-button-text">Notification Preferences</span></button>
  </li>
  <li>
    <button data-url="{% url 'assign_job_billingcodes' job.slug %}" class="dropdown-item js-load-modal-form">Assign Billing Codes</button>
  </li>
  {% load workflow_tags %}
  {% workflow_transitions job as transitions %}
  {% for t in transitions %}{% if t.menu %}
    <li>
      <button data-url="{{ t.url }}" class="dropdown-item js-update-job-workflow text-{{ t.style }}" data-status="{{ t.label }}" data-status-id="{{ t.target }}">{{ t.label }}</button>
    </li>
  {% endif %}{% endfor %}

  {% if request.user.is_superuser %}
    <li>
      <a href="{% url 'admin:jobtracker_job_change' job.pk %}" class="dropdown-item">Django Admin Page</a>
    </li>
  {% endif %}
</ul>
