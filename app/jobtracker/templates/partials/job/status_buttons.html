{% load workflow_tags %}
{% workflow_transitions job as transitions %}
<div class="d-grid">
    <div class="btn-group">
        {% for t in transitions %}{% if not t.menu %}
            <button data-url="{{ t.url }}"
                class="btn btn-outline-{{ t.style }} js-update-job-workflow"
                data-status="{{ t.label }}" data-status-id="{{ t.target }}">
                {% if t.icon %}<span class="{{ t.icon }} me-1"></span>{% endif %}{{ t.label }}
                {% if not t.ready %}
                <span class="ms-1 text-danger" data-feather="alert-triangle" style="height:12.8px;width:12.8px;"></span>
                {% endif %}
            </button>
        {% endif %}{% endfor %}
        {% if job.status == 5 %}
            <a href="{% url 'job_schedule' job.slug %}"
                class="btn btn-outline-success ">
                Edit Scheduling
            </a>
        {% endif %}
    </div>
</div>
