<a href="{{ billingcode.get_absolute_url }}">
    <span class="badge badge-phoenix badge-phoenix-{{ billingcode.get_state_bscolour }}"
    data-bs-toggle="tooltip" data-bs-placement="top"
    title="{% if billingcode.client %}Client: {{ billingcode.client }} {% endif %}{% if billingcode.is_closed %}(Closed){% elif billingcode.is_internal %}(Internal){% elif billingcode.is_chargeable %}(Chargeable){% else %}(Not chargeable){% endif %}">
        {{ billingcode.code }}
    </span>
</a>
