  <table class="table table-responsive table-sm datatable mb-0 mw-100 align-middle fs-9"
  >
    <caption>Projects</caption>
    <thead>
      <tr class="text-body-secondary">
        <th scope="col" data-data="id" data-name="id">ID</th>
        <th class="text-wrap text-break ps-2" scope="col" data-data="title_link" style="word-wrap: break-word;" data-name="title">Name</th>
        <th class="ps-2" scope="col" data-data="unit_link" data-name="unit.name">Unit</th>
        <th class="ps-2" scope="col" data-data="client_link" data-name="client.name">Client</th>
        <th class="col-1 ps-2" scope="col" data-data="status_display" data-name="status" style="width:10%;">Status</th>
      </tr>
    </thead>
    {% if project_list %}
    <tbody>
      {% for project in project_list %}
        {% include 'partials/project/project_list_row.html' %}
      {% endfor %}
    </tbody>
    {% endif %}
  </table>
