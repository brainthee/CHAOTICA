<div class="card" id="basic-info">
   <div class="card-header">
      <div class="row">
         <div class="col my-auto">
            <div class="h-100">
               <h4 class="mb-0">Deliverables</h4>
            </div>
         </div>
         <div class="col-lg-4 text-end"></div>
      </div>
   </div>
   <div class="card-body p-3">

      <div class="row">
         <div class="col">
            <label class="fs-9 mb-1">{{ config.PHASE_LABEL_DELIVERABLE }}</label>
            <input type="text" class="form-control" readonly value="{{ phase.linkDeliverable }}">
         </div>
      </div>

      <div class="row mt-4">
         <div class="col">
            <label class="fs-9 mb-1">{{ config.PHASE_LABEL_REPORT_DATA }}</label>
            <input type="text" class="form-control" readonly value="{{ phase.linkReportData }}">
         </div>
      </div>

      <div class="row mt-4">
         <div class="col">
            <label class="fs-9 mb-1">{{ config.PHASE_LABEL_TECH_DATA }}</label>
            <input type="text" class="form-control" readonly value="{{ phase.linkTechData }}">
         </div>
      </div>
   </div>
 </div>
