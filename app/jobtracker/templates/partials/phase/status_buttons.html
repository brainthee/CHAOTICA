{% load workflow_tags %}
{% workflow_transitions phase as transitions %}
<div class="d-grid">
  <div class="btn-group">
    {% for t in transitions %}{% if not t.menu %}
      <button data-url="{{ t.url }}" class="btn btn-outline-{{ t.style }} js-update-phase-workflow" data-status="{{ t.label }}" data-status-id="{{ t.target }}"{% if t.name == "to_reopen" %} title="Bring this phase back to In Progress{% if phase.job.status == 8 %} (the job reopens too){% endif %}"{% endif %}>
        {% if t.icon %}<span class="{{ t.icon }} me-1"></span>{% endif %}{{ t.label }}{% if not t.ready %}
          <span class="ms-1 text-danger" data-feather="alert-triangle" style="height:12.8px;width:12.8px;"></span>
        {% endif %}
      </button>
    {% endif %}{% endfor %}
  </div>
</div>
