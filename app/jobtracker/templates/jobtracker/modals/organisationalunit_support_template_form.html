{% load widget_tweaks %}
{% load crispy_forms_tags %}
<div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
        <form method="post" action="{{ request.get_full_path }}" class="js-submit-modal-form">
            {% csrf_token %}
            <div class="modal-header">
                <h6 class="modal-title" id="modal-title-default">Support profile member</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            {% crispy form %}
        </form>
    </div>
 </div>

<script>
  $(function () {
    // AJAX user search: bind the dropdown to the modal so it's typeable/scrolls
    // with it. Runs on every (re-)render, including invalid-form re-renders.
    $('#mainModal .select2-widget').select2({
      dropdownParent: $('#mainModal .modal-content'),
      width: '100%'
    });
  });
</script>
