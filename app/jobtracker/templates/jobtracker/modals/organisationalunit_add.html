{% load widget_tweaks %}
{% load crispy_forms_tags %}
<div class="modal-dialog modal- modal-dialog-centered modal-" role="document">
    <div class="modal-content">
        <form method="post" action="{{ request.get_full_path }}" class="js-submit-modal-form">
            {% csrf_token %}
            <div class="modal-header">
                <h6 class="modal-title" 
                    id="modal-title-default">
                        Add membership
                </h6>
                <button type="button" class="btn-close text-body-emphasis" 
                    data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                {% crispy form %}
            </div>

            <div class="modal-footer">
                <button type="submit" class="btn btn-phoenix-primary mb-0">Save</button>
                <button type="button" class="btn btn-light shadow-none mb-0" data-bs-dismiss="modal">Close</button>
            </div>
        </form>
    </div>
 </div>

<script>
  $(function () {
    // AJAX user search: bind the dropdown to the modal so it's typeable/scrolls
    // with it. Runs on every (re-)render, including invalid-form re-renders.
    $('#mainModal .select2-widget').select2({
      dropdownParent: $('#mainModal .modal-content'),
      width: '100%'
    });
  });
</script>
